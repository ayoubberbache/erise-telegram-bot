# =====================================================================
# Render Infrastructure Blueprint (render.yaml)
# ERISE Scientific Club - HNS RE2SD Telegram Bot
# =====================================================================
# Allows 1-click Free Tier deployment on Render as a Web Service.

services:
  - type: web
    name: erise-telegram-bot
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "python bot.py"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: PORT
        value: 10000
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: 3.12.0